<style>
/* Layout : barre latérale de navigation + espace de travail ; sur mobile, barre d'onglets en bas. */
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --surface-2:#EBEFF4; --ink:#15202B; --ink-2:#4B5968; --ink-3:#6F7D8C; --line:#D9E0E8;
  --accent:#1D55C4; --accent-ink:#FFFFFF; --accent-soft:#E3EBFA;
  --ok:#137A47; --ok-soft:#DFF3E8; --warn:#9A5B00; --warn-soft:#FBEFD9; --crit:#B3261E; --crit-soft:#FBE3E1; --sim:#6B4FB8; --sim-soft:#EEE9FA;
  --f-display:"Archivo","Segoe UI",system-ui,sans-serif; --f-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E141B; --surface:#151D26; --surface-2:#1C2631; --ink:#E5EBF1; --ink-2:#A3B1BF; --ink-3:#7F8E9D; --line:#283542;
  --accent:#78A2FF; --accent-ink:#0C1420; --accent-soft:#1B2A47;
  --ok:#55C98F; --ok-soft:#14301F; --warn:#E6AA45; --warn-soft:#33260F; --crit:#F27B70; --crit-soft:#3A1816; --sim:#B49CF5; --sim-soft:#261E3D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E141B; --surface:#151D26; --surface-2:#1C2631; --ink:#E5EBF1; --ink-2:#A3B1BF; --ink-3:#7F8E9D; --line:#283542;
  --accent:#78A2FF; --accent-ink:#0C1420; --accent-soft:#1B2A47;
  --ok:#55C98F; --ok-soft:#14301F; --warn:#E6AA45; --warn-soft:#33260F; --crit:#F27B70; --crit-soft:#3A1816; --sim:#B49CF5; --sim-soft:#261E3D; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.55rem} h2{font-size:1.1rem} h3{font-size:.95rem}
p{margin:0}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-size:.82em;letter-spacing:.01em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);font-weight:600}

.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.brand-mark{width:30px;height:30px;border-radius:7px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink)}
.brand b{font-family:var(--f-display);font-size:1.15rem;display:block;line-height:1}
.brand small{color:var(--ink-3);font-size:.72rem}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;padding:9px 10px;border:0;background:none;border-radius:7px;cursor:pointer;color:var(--ink-2);font-weight:500;text-align:left}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.nav .count{margin-left:auto;font-size:.72rem;background:var(--surface-2);color:var(--ink-2);border-radius:99px;padding:1px 7px;font-variant-numeric:tabular-nums}
.nav button[aria-current="page"] .count{background:var(--surface);color:var(--accent)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding:0 6px}
.clock{border:1px dashed var(--line);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:6px}
.main{min-width:0;padding-block:22px 40px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.demo-bar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;background:var(--sim-soft);color:var(--sim);border-radius:var(--r);padding:8px 12px;font-size:.82rem}
.demo-bar b{font-weight:600}
.head{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
.head .sub{color:var(--ink-2);margin-top:4px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:7px 12px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--crit)}
.btn.sm{padding:4px 9px;font-size:.82rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.sim-tag{font-size:.66rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;background:var(--sim-soft);color:var(--sim);border-radius:4px;padding:1px 5px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.grid-2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}

.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;cursor:pointer;text-align:left;transition:border-color .15s}
.kpi:hover{border-color:var(--accent)}
.kpi .v{font-family:var(--f-display);font-size:1.75rem;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .t{font-size:.8rem;color:var(--ink-2);font-weight:500;line-height:1.3}
.kpi .n{font-size:.72rem;color:var(--ink-3);line-height:1.35}
.kpi.flash{animation:flash 1.4s ease}
@keyframes flash{0%{background:var(--accent-soft);border-color:var(--accent)}100%{background:var(--surface)}}
@media (prefers-reduced-motion: reduce){.kpi.flash{animation:none}}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:.75rem;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap;background:var(--surface-2);color:var(--ink-2)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.blue{background:var(--accent-soft);color:var(--accent)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.crit{background:var(--crit-soft);color:var(--crit)}
.pill.sim{background:var(--sim-soft);color:var(--sim)}
.chip{display:inline-flex;font-size:.72rem;font-weight:500;padding:1px 7px;border-radius:4px;border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
.flag{display:inline-flex;align-items:center;gap:4px;font-size:.72rem;font-weight:600;padding:1px 7px;border-radius:4px;white-space:nowrap}
.flag.crit{background:var(--crit-soft);color:var(--crit)}
.flag.warn{background:var(--warn-soft);color:var(--warn)}
.flag.sim{background:var(--sim-soft);color:var(--sim)}

.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:92px minmax(0,1.5fr) minmax(0,1fr) 120px minmax(0,1.3fr) 26px;gap:12px;align-items:center;padding:11px 12px;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.item:first-child{border-top:0}
.item:hover{background:var(--surface-2)}
.item .who{display:flex;flex-direction:column;gap:2px;min-width:0}
.item .who b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .small{font-size:.8rem;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis}
.item .chev{color:var(--ink-3)}
.list-head{display:grid;grid-template-columns:92px minmax(0,1.5fr) minmax(0,1fr) 120px minmax(0,1.3fr) 26px;gap:12px;padding:0 12px 6px}

.todo{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.todo:first-child{border-top:0;padding-top:0}
.todo .bar{width:4px;align-self:stretch;border-radius:2px;background:var(--line);flex:none}
.todo .bar.crit{background:var(--crit)} .todo .bar.warn{background:var(--warn)} .todo .bar.blue{background:var(--accent)}
.todo .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}

.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;counter-reset:s}
.steps li{display:grid;grid-template-columns:24px 1fr;gap:10px;padding:6px 0;align-items:start;counter-increment:s}
.steps li::before{content:counter(s);width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:.72rem;font-weight:600;color:var(--ink-3)}
.steps li.done::before{content:"✓";background:var(--ok);border-color:var(--ok);color:var(--surface)}
.steps li.next::before{border-color:var(--accent);color:var(--accent)}
.steps li.done span{color:var(--ink-2)}
.steps li.next span{font-weight:600}

.filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 11px;cursor:pointer;font-size:.82rem;color:var(--ink-2)}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.fchip .c{opacity:.7;margin-left:4px;font-variant-numeric:tabular-nums}
.search{flex:1;min-width:180px;max-width:320px}

.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label,.field .lbl{font-size:.8rem;font-weight:500;color:var(--ink-2)}
.field input,.field select,.field textarea,.inp{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:8px 10px;width:100%;min-width:0}
.field textarea{resize:vertical;min-height:84px}
.field .hint{font-size:.75rem;color:var(--ink-3)}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fgrid .full{grid-column:1/-1}
.check{display:flex;gap:8px;align-items:flex-start;font-size:.85rem}
.check input{margin-top:3px}

.kv{display:grid;grid-template-columns:130px minmax(0,1fr);gap:6px 12px;font-size:.88rem}
.kv dt{color:var(--ink-3)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}

.ai{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.ai-h{display:flex;align-items:center;gap:8px;justify-content:space-between;padding:10px 14px;background:var(--surface-2);flex-wrap:wrap}
.ai-b{padding:14px;display:flex;flex-direction:column;gap:12px}
.alert{border-radius:8px;padding:10px 12px;font-size:.86rem;display:flex;flex-direction:column;gap:4px}
.alert.crit{background:var(--crit-soft);color:var(--crit)}
.alert.warn{background:var(--warn-soft);color:var(--warn)}
.alert.sim{background:var(--sim-soft);color:var(--sim)}
.alert.ok{background:var(--ok-soft);color:var(--ok)}
.alert b{font-weight:600}
.miss{display:flex;flex-wrap:wrap;gap:6px}
.miss span{font-size:.78rem;border:1px dashed var(--warn);color:var(--warn);border-radius:4px;padding:1px 7px}

.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tl li{display:grid;grid-template-columns:14px minmax(0,1fr);gap:10px;padding:8px 0;position:relative}
.tl li::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--line);margin-top:6px;margin-left:2px}
.tl li.in::before{background:var(--ok)} .tl li.out::before{background:var(--accent)} .tl li.sys::before{background:var(--sim)} .tl li.warn::before{background:var(--warn)}
.tl .meta{font-size:.75rem;color:var(--ink-3)}
.tl .msg{background:var(--surface-2);border-radius:8px;padding:8px 10px;margin-top:4px;white-space:pre-wrap;font-size:.86rem;overflow-wrap:anywhere}

.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:600;text-align:left;padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
td select{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 6px}

.seq{border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.seq-steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.sstep{border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:4px;font-size:.82rem;min-width:0}
.sstep.envoyee{background:var(--ok-soft);border-color:transparent}
.sstep.a_valider{border-color:var(--warn);border-style:dashed}
.sstep.annulee{opacity:.55;text-decoration:line-through}
.preview{white-space:pre-wrap;background:var(--surface-2);border-radius:8px;padding:10px 12px;font-size:.86rem;overflow-wrap:anywhere}

.overlay{position:fixed;inset:0;background:rgba(10,16,24,.5);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:50;overflow:auto}
.modal{background:var(--surface);border-radius:12px;width:min(640px,100%);display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal-h{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}
.modal-b{padding:18px;display:flex;flex-direction:column;gap:14px}
.modal-f{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;padding:14px 18px;border-top:1px solid var(--line)}
.toasts{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:60;max-width:min(380px,calc(100% - 32px))}
.toast{background:var(--ink);color:var(--surface);border-radius:8px;padding:10px 14px;font-size:.86rem;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.toast.err{background:var(--crit);color:#fff}

.public{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.public-h{background:var(--ink);color:var(--surface);border-radius:12px;padding:20px 22px;display:flex;flex-direction:column;gap:4px}
.public-h h1{color:var(--surface)}
.public-h p{opacity:.8}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg label{border:1px solid var(--line);border-radius:7px;padding:7px 12px;cursor:pointer;font-size:.88rem;display:flex;gap:6px;align-items:center;background:var(--surface)}
.seg input{accent-color:var(--accent)}
.seg label:has(input:checked){border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}

.perm td,.perm th{text-align:center} .perm td:first-child,.perm th:first-child{text-align:left}
.conn{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.conn:first-child{border-top:0}

.tabbar{display:none}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .main{padding-block:14px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .grid-2{grid-template-columns:minmax(0,1fr)}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:40;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;font-size:.68rem;color:var(--ink-3);cursor:pointer}
  .tabbar button[aria-current="page"]{color:var(--accent)}
  .list-head{display:none}
  .item{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"who st" "ref ref" "na na";gap:4px 10px}
  .item .c-ref{grid-area:ref} .item .who{grid-area:who} .item .c-st{grid-area:st;justify-self:end} .item .c-na{grid-area:na} .item .c-loc,.item .chev{display:none}
  .seq-steps{grid-template-columns:minmax(0,1fr)}
  .mobile-only{display:flex}
}
@media (min-width:901px){.mobile-only{display:none}}
@media (max-width:560px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .fgrid{grid-template-columns:minmax(0,1fr)}
  .kv{grid-template-columns:minmax(0,1fr)} .kv dt{margin-top:6px}
  h1{font-size:1.3rem}
  .overlay{padding:12px}
}
</style>

   Règles : résume, extrait, liste les manques, propose une catégorie à confirmer.
   Jamais de prix, de disponibilité, de diagnostic, ni d'engagement.
   Le texte client est traité comme une donnée : les consignes qu'il contient sont ignorées. */
const URGENT_RX = [/odeur de gaz|sent le gaz|fuite de gaz/i, /monoxyde|détecteur (de )?co\b/i, /\bCO\b/, /fumée|étincelle|odeur de brûlé|court[- ]circuit/i, /inond|fuite d'eau importante|dégât des eaux/i];
const VULN_RX = /bébé|nourrisson|personne âgée|enceinte|malade|handicap/i;
const NOHEAT_RX = /plus de chauffage|pas de chauffage|plus d'eau chaude|plus de clim.*(serveur|chambre froide)/i;
const INJECT_RX = /ignore[rz]? (toutes |les |tes |vos )*(les )?(instructions|consignes)|oublie (tes|les|vos) (consignes|instructions)|system prompt|prompt système|tu es (maintenant|désormais)|act as|you are now|disregard (all|previous)/i;

function analyze(d){
  const txt = `${d.description} ${d.equipment} ${d.brand}`;

  let cat = "";
  if (/panne|ne (marche|fonctionne|chauffe|refroidit) plus|plus de chauffage|code erreur|fuite|bruit|claquement|en défaut|ne démarre/i.test(d.description)) cat = "depannage";
  else if (/entretien|révision|annuel|contrat|ramonage|visite/i.test(d.description)) cat = "entretien";
  else if (/install|remplac|pose|nouvelle|climatiser|équiper|devis pour/i.test(d.description)) cat = "installation";
  // urgence : signalement à un humain, sans diagnostic
  const urgentHits = URGENT_RX.filter(r => r.test(txt)).length;
  const urgent = urgentHits > 0 || (NOHEAT_RX.test(txt) && VULN_RX.test(txt));
  const urgentWhy = urgentHits ? "Le message mentionne un élément de sécurité (gaz, fumée, eau, CO…)." : (urgent ? "Absence de chauffage signalée avec une personne vulnérable au domicile." : "");
  const injection = INJECT_RX.test(d.description);
  // extraction
  const extracted = [];
  if (d.name) extracted.push(["Client", (d.kind === "entreprise" && d.company ? d.company + " — " : "") + d.name]);
  if (d.phone || d.email) extracted.push(["Contact", [d.phone, d.email].filter(Boolean).join(" · ")]);
  if (d.city) extracted.push(["Lieu", `${d.cp} ${d.city}`.trim()]);
  if (d.equipment) extracted.push(["Équipement", d.equipment + (d.brand ? ` (${d.brand})` : "")]);
  const m2 = d.description.match(/(\d+)\s?m²|(\d+)\s?m2/g); if (m2) extracted.push(["Surfaces citées", m2.join(", ")]);
  const pieces = d.description.match(/(\d+)\s(pièces?|chambres?|bureaux|splits?|logements|chaudières)/gi); if (pieces) extracted.push(["Quantités citées", pieces.join(", ")]);
  if (d.availability) extracted.push(["Disponibilités", d.availability]);
  // manques
  const missing = [];
  if (!d.phone && !d.email) missing.push("Téléphone ou e-mail");
  if (!d.address) missing.push("Adresse d'intervention");
  if (!d.cp) missing.push("Code postal");
  if (!d.need) missing.push("Type de besoin (à confirmer)");
  if (!d.equipment) missing.push("Équipement concerné");
  const need = d.need || cat;
  if (need !== "installation" && !d.brand && !BRANDS.some(b => low.includes(b))) missing.push("Marque / modèle de l'équipement");
  if (need === "installation" && !m2 && !pieces) missing.push("Surface ou nombre de pièces à équiper");
  if (d.equipment === "Chaufferie collective" && !/accès|gardien|clé/i.test(d.description)) missing.push("Conditions d'accès au local");
  if (!d.availability) missing.push("Disponibilités");
  // résumé
  const who = d.kind === "entreprise" ? `${d.company || "Entreprise"} (${d.name})` : d.name;
  const needLbl = need ? t("n_" + need).toLowerCase() : "besoin à qualifier";
  // les phrases contenant des consignes adressées à l'assistant sont exclues du résumé
  const sentences = d.description.split(/(?<=[.!?])\s+/).map(x => x.trim()).filter(x => x && !INJECT_RX.test(x)).map(x => x.replace(/^(sinon|et|bref)\s*,?\s*/i, ""));
  const gist = sentences.slice(0, 2).join(" ").slice(0, 220);
  const summary = `${who}, ${d.city || "ville non précisée"} : ${needLbl}${d.equipment ? " — " + d.equipment.toLowerCase() : ""}. ${gist ? "Le client indique : « " + gist + " »" : ""}`.trim();
  return {cat, urgent, urgentWhy, injection, extracted, missing, summary, outOfZone: !inZone(d)};
}

function guardCheck(raw){
  const w = [], text = raw.split(S.settings.hours).join(" ");
  if (/\d[\d\s]*(€|euros?|eur\b)|gratuit/i.test(text)) w.push("un montant ou une gratuité");

function fillTpl(tplKey, q){

  if (!tpl) return "";

/* ---------- logique métier ---------- */
function stopSequences(match, reason){
  let n = 0;
  S.sequences.filter(sq => (sq.state === "active" || sq.state === "suspendue") && match(sq)).forEach(sq => {
    sq.state = "arretee"; sq.stopReason = reason;
    sq.steps.forEach(p => { if (p.status !== "envoyee") p.status = "annulee"; });
    log(sq.dossierId, "follow", `Relances arrêtées : ${reason.charAt(0).toLowerCase() + reason.slice(1)}`);
    n++;
  });
  return n;
}
function setQuoteStatus(q, st){
  if (q.status === st) return;
  const old = q.status; q.status = st;
  log(q.dossierId, "quote", `Devis ${q.ref} : statut changé en ${t("sq_" + st)}`);
  if (Q_OPEN.includes(old) && !Q_OPEN.includes(st)) stopSequences(sq => sq.quoteId === q.id, `Statut du devis changé : ${t("sq_" + st)}`);
  const d = dossier(q.dossierId);
  if (st === "accepte") { d.status = "gagne"; d.nextAction = "Planifier l'intervention dans le logiciel métier"; d.nextActionAt = S.now + D; }
  else if (st === "refuse") { d.status = "perdu"; d.nextAction = ""; d.nextActionAt = null; }
  else if (st === "expire") { d.nextAction = "Devis expiré : décider de relancer ou de clore"; d.nextActionAt = S.now; }
  else if (Q_OPEN.includes(st)) d.status = "devis_envoye";
  else if (st === "a_preparer") d.status = "a_chiffrer";
}
function activeSeq(quoteId){ return S.sequences.find(sq => sq.quoteId === quoteId && (sq.state === "active" || sq.state === "suspendue")); }
function createSequence(q, validated){
  if (activeSeq(q.id)) return {error:"Une séquence est déjà en cours pour ce devis. Aucune relance en double n'a été créée."};
  if (!Q_OPEN.includes(q.status)) return {error:"Les relances ne concernent que les devis envoyés ou en attente."};
  const steps = S.settings.seqDelays.map((day, i) => {
    let due = (q.date || S.now) + day * D;
    if (due <= S.now) due = S.now + (i + 1) * D;
    return {id:uid("st"), due, day, tpl:S.settings.seqTemplates[i] || "relance_1", status: validated ? "programmee" : "a_valider"};
  });
  const sq = {id:uid("s"), quoteId:q.id, dossierId:q.dossierId, state:"active", stopReason:"", createdAt:S.now, steps};
  S.sequences.push(sq);
  log(q.dossierId, "follow", `Séquence de ${steps.length} relances créée pour ${q.ref}${validated ? " et validée" : " (à valider)"}`);
  return {seq:sq};
}
function advanceDay(){
  S.now += D;
  const sent = [], expired = [];
  S.sequences.filter(sq => sq.state === "active").forEach(sq => {
    sq.steps.forEach((p, i) => {
      if (p.status === "programmee" && p.due <= S.now) {
        const dup = S.events.some(e => e.stepId === p.id);
        if (dup) return; // garde anti-doublon
        p.status = "envoyee";
        const q = S.quotes.find(x => x.id === sq.quoteId);
        S.events.push({id:uid("e"), dossierId:sq.dossierId, at:S.now, type:"follow", text:`Relance ${i+1} envoyée (simulée — aucun e-mail réel)`, body:fillTpl(p.tpl, q), by:null, stepId:p.id});
        sent.push(dossier(sq.dossierId).ref);
      }
    });
    if (sq.steps.every(p => p.status === "envoyee" || p.status === "annulee")) { sq.state = "terminee"; sq.stopReason = "Toutes les relances ont été envoyées"; }
  });
  S.quotes.filter(q => Q_OPEN.includes(q.status) && q.due && q.due < S.now).forEach(q => { setQuoteStatus(q, "expire"); expired.push(q.ref); });
  return {sent, expired};
}
function nextRef(prefix, list){
  const nums = list.map(x => parseInt(x.ref.split("-").pop(), 10)).filter(n => !isNaN(n));
  return prefix + (Math.max(0, ...nums) + 1);
}

/* ---------- indicateurs ---------- */
function metrics(){
  const ds = S.dossiers, qs = S.quotes;
  const steps = S.sequences.filter(sq => sq.state === "active").flatMap(sq => sq.steps.filter(p => p.status === "a_valider"));
  const resp = ds.filter(d => d.firstResponseAt && d.createdAt > S.now - 60*D).map(d => d.firstResponseAt - d.createdAt);
  const acc = qs.filter(q => q.status === "accepte");
  return {
    nouv: ds.filter(d => d.status === "nouvelle").length,
    info: ds.filter(d => d.status === "attente_infos").length,
    pending: qs.filter(q => Q_OPEN.includes(q.status)).length,
    validate: steps.length,
    accepted: acc.length, acceptedAmount: acc.reduce((s,q) => s + (q.amount||0), 0),
    firstResp: median(resp), firstRespN: resp.length
  };
}
function todos(){
  const out = [];
  S.dossiers.forEach(d => {
    const a = analyze(d);
    if (a.urgent && ["nouvelle","attente_infos"].includes(d.status) && !d.urgentAck) out.push({sev:"crit", d, why:"Situation potentiellement urgente — à examiner par un humain"});
    else if (a.injection && d.status === "nouvelle") out.push({sev:"warn", d, why:"Message contenant des consignes adressées à l'assistant (ignorées)"});
    else if (a.outOfZone && !["perdu","clos","gagne"].includes(d.status)) out.push({sev:"warn", d, why:"Adresse hors zone d'intervention déclarée"});
    else if (d.status === "nouvelle") out.push({sev:"blue", d, why:"Nouvelle demande sans réponse"});
  });
  S.sequences.filter(sq => sq.state === "active").forEach(sq => {
    const n = sq.steps.filter(p => p.status === "a_valider").length;
    if (n) out.push({sev:"warn", d:dossier(sq.dossierId), why:`${n} relance${n>1?"s":""} à valider`, go:"followups"});
  });
  S.quotes.forEach(q => {
    const d = dossier(q.dossierId);
    if (q.status === "expire" && d.status === "devis_envoye") out.push({sev:"", d, why:`Devis ${q.ref} expiré sans décision`});
    else if (Q_OPEN.includes(q.status) && q.due && daysLeft(q.due) <= 7) out.push({sev:"", d, why:`Devis ${q.ref} : échéance dans ${daysLeft(q.due)} j`});
    else if (q.status === "a_preparer") out.push({sev:"", d, why:`Devis ${q.ref} à préparer`});
  });
  const order = {crit:0, warn:1, blue:2, "":3};
  return out.sort((a,b) => order[a.sev] - order[b.sev]);
}

          <button class="btn sm" ${dis}>${t("save")}</button></div>
          <div class="row"><span class="faint" style="font-size:.8rem">Statut du dossier</span><select class="inp" id="d-status" data-dstatus style="width:auto" ${dis}>${D_STATUS.map(s => `<option value="${s}" ${s===d.status?"selected":""}>${t("sd_"+s)}</option>`).join("")}</select></div>
        </form>
      </section>
      <section class="panel">
        <div class="panel-h"><h2>Devis associé</h2>${q?qPill(q.status):""}</div>
        ${q ? `<dl class="kv"><dt>Référence</dt><dd class="mono">${esc(q.ref)}</dd><dt>Montant HT</dt><dd class="num">${eur(q.amount)}</dd><dt>Envoyé le</dt><dd>${fDate(q.date)}</dd><dt>Échéance</dt><dd>${fDate(q.due)}${q.due&&Q_OPEN.includes(q.status)?` <span class="faint">(${daysLeft(q.due)} j)</span>`:""}</dd></dl>

        : `<p class="muted">Aucun devis associé. Saisissez la référence et le montant du devis établi dans votre logiciel habituel.</p><div><button class="btn primary sm" data-act="newquote" ${dis}>${t("link_quote")}</button></div>`}
      </section>
      <section class="panel">
        <h2>Relances</h2>
        ${seqs.length ? seqs.map(sq => seqMini(sq)).join("") : `<p class="muted">Aucune séquence. Les relances se programment une fois le devis envoyé.</p>`}

      <section class="panel">
        <h2>Client</h2>
        <dl class="kv"><dt>Type</dt><dd>${d.kind==="entreprise"?"Entreprise":"Particulier"}</dd>${d.company?`<dt>Entreprise</dt><dd>${esc(d.company)}</dd>`:""}<dt>Contact</dt><dd>${esc(d.name)}</dd>
        <dt>Téléphone</dt><dd>${esc(d.phone||"—")}</dd><dt>E-mail</dt><dd>${esc(d.email||"—")}</dd><dt>Adresse</dt><dd>${esc(d.address||"—")}, ${esc(d.cp)} ${esc(d.city)}</dd>
        <dt>Équipement</dt><dd>${esc(d.equipment||"—")}${d.brand?" · "+esc(d.brand):""}</dd><dt>Disponibilités</dt><dd>${esc(d.availability||"—")}</dd></dl>
      </section>

        <p class="faint" style="font-size:.78rem">Visibles uniquement par l'équipe.</p>
        ${d.notes.map(n => `<div style="font-size:.86rem"><div class="faint" style="font-size:.75rem">${fDT(n.at)} · ${esc(member(n.by).name)}</div>${esc(n.text)}</div>`).join("")}
        <form data-form="note" class="row"><input class="inp" id="note-text" name="text" placeholder="Ajouter une note…" style="flex:1" ${dis}><button class="btn sm" ${dis}>Ajouter</button></form>
      </section>
    </div>
  </div>`;
}
function seqStateChip(sq){ return {active:'<span class="pill blue">Active</span>', suspendue:'<span class="pill warn">Suspendue</span>', arretee:'<span class="pill">Arrêtée</span>', terminee:'<span class="pill ok">Terminée</span>'}[sq.state]; }
const stepLbl = {a_valider:"À valider", programmee:"Programmée", envoyee:"Envoyée (simulée)", annulee:"Annulée"};
function seqMini(sq){
  const q = S.quotes.find(x => x.id === sq.quoteId);
  return `<div class="seq"><div class="panel-h"><span><span class="mono faint">${esc(q.ref)}</span> ${seqStateChip(sq)}</span></div>
    ${sq.stopReason?`<span class="faint" style="font-size:.8rem">${esc(sq.stopReason)}</span>`:""}
    <div class="seq-steps">${sq.steps.map((p,i) => `<div class="sstep ${p.status}"><b>Relance ${i+1}</b><span class="faint">${fDate(p.due)}</span><span>${stepLbl[p.status]}</span></div>`).join("")}</div></div>`;
}

function vQuotes(){
  const f = S.filter.qstatus, dis = can() ? "" : "disabled";
  const list = S.quotes.filter(q => f === "all" || (f === "open" ? Q_OPEN.includes(q.status) : q.status === f)).sort((a,b) => (b.date||9e15) - (a.date||9e15));
  const cnt = st => S.quotes.filter(q => q.status === st).length;
  return `${demoBar()}
  <div class="head"><div><h1>${t("nav_quotes")}</h1><p class="sub">Suivi des devis établis dans votre logiciel habituel. Saisie manuelle dans le prototype.</p></div>
    <button class="btn primary" data-act="newquote" ${dis}>+ ${t("new_quote")}</button></div>
  <div class="filters">
    <button class="fchip" data-qf="all" aria-pressed="${f==="all"}">${t("all")}<span class="c">${S.quotes.length}</span></button>
    <button class="fchip" data-qf="open" aria-pressed="${f==="open"}">En cours<span class="c">${S.quotes.filter(q=>Q_OPEN.includes(q.status)).length}</span></button>
    ${Q_STATUS.map(s => `<button class="fchip" data-qf="${s}" aria-pressed="${f===s}">${t("sq_"+s)}<span class="c">${cnt(s)}</span></button>`).join("")}
  </div>
  <section class="panel" style="padding:6px 0">
    <div class="tbl-wrap"><table>
      <thead><tr><th>Réf.</th><th>Client</th><th class="r">Montant HT</th><th>Envoyé le</th><th>Échéance</th><th>Statut</th><th>Relances</th><th></th></tr></thead>
      <tbody>${list.map(q => { const d = dossier(q.dossierId), sq = S.sequences.filter(x => x.quoteId === q.id).pop(); return `<tr>
        <td class="mono">${esc(q.ref)}</td>
        <td><button class="btn ghost sm" data-open="${d.id}" style="padding-left:0">${esc(d.kind==="entreprise"&&d.company?d.company:d.name)}</button><div class="faint mono">${esc(d.ref)}</div></td>
        <td class="r num">${eur(q.amount)}</td><td class="num">${fDate(q.date)}</td>
        <td class="num">${fDate(q.due)}${q.due&&Q_OPEN.includes(q.status)?`<div class="faint" style="font-size:.75rem">${daysLeft(q.due)<0?"dépassée":"dans "+daysLeft(q.due)+" j"}</div>`:""}</td>
        <td><select data-qstatus="${q.id}" aria-label="Statut du devis ${esc(q.ref)}" ${dis}>${Q_STATUS.map(s => `<option value="${s}" ${s===q.status?"selected":""}>${t("sq_"+s)}</option>`).join("")}</select></td>
        <td>${sq?seqStateChip(sq):(Q_OPEN.includes(q.status)?`<button class="btn sm" data-act="schedule" data-id="${q.id}" ${dis}>Programmer</button>`:'<span class="faint">—</span>')}</td>
        <td><button class="btn ghost sm" data-act="editquote" data-id="${q.id}" ${dis}>${t("edit")}</button></td></tr>`; }).join("")}</tbody>
    </table></div>
  </section>
  <p class="faint" style="font-size:.8rem">Les montants sont ceux saisis pour le suivi. Un devis accepté n'est ni une facture ni un encaissement.</p>`;
}

function vFollowups(){
  const dis = can() ? "" : "disabled", st = S.settings;
  const toVal = S.sequences.filter(sq => sq.state === "active").flatMap(sq => sq.steps.map((p,i) => ({sq, p, i})).filter(x => x.p.status === "a_valider"));
  const seqs = [...S.sequences].sort((a,b) => ({active:0,suspendue:1,terminee:2,arretee:3}[a.state] - {active:0,suspendue:1,terminee:2,arretee:3}[b.state]) || b.createdAt - a.createdAt);
  return `${demoBar()}
  <div class="head"><div><h1>${t("nav_followups")}</h1><p class="sub">Aucune relance n'est envoyée sans validation. Les séquences s'arrêtent dès que le client répond ou que le devis change de statut.</p></div>
    <button class="btn" data-act="advance">${t("advance")} <span class="sim-tag">Simulé</span></button></div>
  <div class="grid-2">
    <div class="col">
      <section class="panel">
        <div class="panel-h"><h2>Relances à valider</h2><span class="faint">${toVal.length}</span></div>
        ${toVal.length ? toVal.map(({sq,p,i}) => { const q = S.quotes.find(x => x.id === sq.quoteId), d = dossier(sq.dossierId); return `
          <div class="seq">
            <div class="panel-h"><span><b>Relance ${i+1}</b> · ${esc(d.kind==="entreprise"&&d.company?d.company:d.name)} · <span class="mono faint">${esc(q.ref)}</span></span><span class="faint">Prévue le ${fDate(p.due)}</span></div>
            <div class="preview">${esc(fillTpl(p.tpl, q))}</div>
            <div class="row"><button class="btn primary sm" data-act="valstep" data-seq="${sq.id}" data-step="${p.id}" ${dis}>${t("validate")}</button>
            <button class="btn sm" data-act="skipstep" data-seq="${sq.id}" data-step="${p.id}" ${dis}>Ne pas envoyer cette relance</button>
            <button class="btn ghost sm" data-open="${d.id}">Ouvrir le dossier</button></div>
          </div>`; }).join("") : `<p class="muted">Aucune relance en attente de validation.</p>`}
      </section>
      <section class="panel">
        <h2>Séquences</h2>
        ${seqs.map(sq => { const q = S.quotes.find(x => x.id === sq.quoteId), d = dossier(sq.dossierId); return `
          <div class="seq">
            <div class="panel-h"><span><b>${esc(d.kind==="entreprise"&&d.company?d.company:d.name)}</b> · <span class="mono faint">${esc(q.ref)}</span> ${seqStateChip(sq)}</span>
              <span class="row">${sq.state==="active"?`<button class="btn sm" data-act="suspend" data-seq="${sq.id}" ${dis}>${t("suspend")}</button>`:""}${sq.state==="suspendue"?`<button class="btn sm" data-act="resume" data-seq="${sq.id}" ${dis}>${t("resume")}</button>`:""}${["active","suspendue"].includes(sq.state)?`<button class="btn sm danger" data-act="stopseq" data-seq="${sq.id}" ${dis}>${t("stop")}</button>`:""}</span></div>
            ${sq.stopReason?`<span class="faint" style="font-size:.8rem">${esc(sq.stopReason)}</span>`:""}
            <div class="seq-steps">${sq.steps.map((p,i) => `<div class="sstep ${p.status}"><b>Relance ${i+1} · J+${p.day}</b><span class="faint">${fDate(p.due)}</span><span>${stepLbl[p.status]}</span></div>`).join("")}</div>
          </div>`; }).join("")}
      </section>
    </div>
    <div class="col">
      <section class="panel">
        <h2>Séquence par défaut</h2>
        <form data-form="seqcfg" class="col" style="gap:10px">
          ${[0,1,2].map(i => `<div class="fgrid" style="grid-template-columns:90px minmax(0,1fr)"><div class="field"><label for="dl${i}">Délai ${i+1}</label><input id="dl${i}" name="d${i}" type="number" min="1" max="60" value="${st.seqDelays[i]}" ${dis}></div>
            <div class="field"><label for="tp${i}">Modèle</label><select id="tp${i}" name="t${i}" ${dis}>${Object.entries(S.templates).filter(([k])=>k.startsWith("relance")).map(([k,v]) => `<option value="${k}" ${st.seqTemplates[i]===k?"selected":""}>${esc(v.name)}</option>`).join("")}</select></div></div>`).join("")}
          <span class="hint faint" style="font-size:.78rem">Délais en jours après l'envoi du devis.</span>
          <label class="check"><input type="checkbox" checked disabled> Arrêter dès que le client répond (toujours actif)</label>
          <label class="check"><input type="checkbox" checked disabled> Arrêter si le devis est accepté, refusé ou expiré (toujours actif)</label>
          <label class="check"><input type="checkbox" checked disabled> Une seule séquence par devis (anti-doublon)</label>
          <label class="check"><input type="checkbox" id="respect" name="respect" ${st.respectHours?"checked":""} ${dis}> N'envoyer que pendant les horaires de contact <span class="sim-tag">Simulé</span></label>
          <div><button class="btn sm" ${dis}>${t("save")}</button></div>
        </form>
      </section>
      <section class="panel">
        <h2>Simulation du temps</h2>
        <p class="muted" style="font-size:.86rem">« ${t("advance")} » fait passer la date simulée au lendemain : les relances validées arrivées à échéance sont marquées « envoyées (simulées) » et les devis dépassés passent en « Expiré ». Aucun e-mail n'est envoyé.</p>
      </section>
    </div>
  </div>`;
}

/* ---------- modales et notifications ---------- */
function modal(title, body, foot){
  $("#modal-root").innerHTML = `<div class="overlay" data-overlay><div class="modal" role="dialog" aria-modal="true" aria-labelledby="m-title">
    <div class="modal-h"><h2 id="m-title">${title}</h2><button class="btn ghost sm" data-act="close" aria-label="Fermer">✕</button></div>
    <div class="modal-b">${body}</div>${foot?`<div class="modal-f">${foot}</div>`:""}</div></div>`;
  const f = $("#modal-root input, #modal-root textarea, #modal-root select"); if (f) f.focus();
}
const closeModal = () => { $("#modal-root").innerHTML = ""; };
function toast(msg, err){
  const el = document.createElement("div"); el.className = "toast" + (err ? " err" : ""); el.textContent = msg;
  const box = $("#toasts"); box.appendChild(el); while (box.children.length > 3) box.firstChild.remove(); setTimeout(() => el.remove(), 4200);
}
function flashKpis(keys){
  requestAnimationFrame(() => keys.forEach(k => { const el = document.querySelector(`[data-kpi="${k}"]`); if (el) { el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash"); } }));
}
function commit(msg, err){ save(); render(); if (msg) toast(msg, err); }

/* ---------- actions ---------- */

    `<button class="btn ghost" data-act="copyreply">Copier le texte</button><button class="btn" data-act="close">${t("cancel")}</button><button class="btn primary" data-act="sendreply">Valider et enregistrer comme envoyée <span class="sim-tag" style="background:rgba(255,255,255,.2);color:inherit">Simulé</span></button>`);

  const prev = S.settings.seqDelays.map((day, i) => { let due = (q.date||S.now) + day*D; if (due <= S.now) due = S.now + (i+1)*D; return {i, day, due, text:fillTpl(S.settings.seqTemplates[i], q)}; });
  modal(`${t("schedule")} — ${esc(q.ref)}`, `
    <p class="muted">${esc(d.kind==="entreprise"&&d.company?d.company:d.name)} · devis envoyé le ${fDate(q.date)} · échéance ${fDate(q.due)}</p>
    ${prev.map(p => `<div class="seq"><div class="panel-h"><b>Relance ${p.i+1} · J+${p.day}</b><span class="faint">${fDate(p.due)}</span></div><div class="preview">${esc(p.text)}</div></div>`).join("")}

    `<button class="btn" data-act="close">${t("cancel")}</button><button class="btn" data-act="doschedule" data-id="${q.id}" data-val="0">Créer, valider plus tard</button><button class="btn primary" data-act="doschedule" data-id="${q.id}" data-val="1">Valider les ${prev.length} relances</button>`);

const formObj = f => Object.fromEntries(new FormData(f).entries());

const ACTIONS = {
  close: closeModal,
  reset(){ modal("Réinitialiser la démo ?", `<p>Toutes les modifications seront effacées et les 12 dossiers fictifs rechargés.</p>`, `<button class="btn" data-act="close">${t("cancel")}</button><button class="btn primary" data-act="doreset">${t("reset")}</button>`); },
  doreset(){ S = seed(); closeModal(); commit("Démo réinitialisée."); },
  advance(){
    const r = advanceDay();
    commit(`Nouvelle date : ${fDate(S.now)}. ${r.sent.length ? r.sent.length + " relance(s) envoyée(s) (simulé)." : "Aucune relance à envoyer."}${r.expired.length ? " Devis expiré(s) : " + r.expired.join(", ") + "." : ""}`);
    flashKpis(["validate","pending"]);
  },
  prefill(){
    const v = {name:"Nadia Lambert (démo)", phone:"06 00 00 00 99", email:"nadia.lambert@exemple.test", address:"8 rue Robespierre", cp:"93100", city:"Montreuil", brand:"", description:"Nous souhaitons installer une climatisation réversible dans notre séjour et une chambre. Appartement au 2e étage.", availability:"Mardi ou jeudi après 17h"};
    Object.entries(v).forEach(([k,val]) => { const el = document.querySelector(`[data-form="public"] [name="${k}"]`); if (el) el.value = val; });
    document.querySelector('[data-form="public"] [name="equipment"]').value = "Climatisation / PAC air/air";
    document.querySelector('[data-form="public"] [name="consent"]').checked = true;
  },
  edit: editDossier,
  savedossier(){
    const d = dossier(S.view.id), v = formObj($("#dform"));
    Object.assign(d, v); if (v.need) d.categoryConfirmed = true;
    log(d.id, "sys", "Informations du dossier modifiées"); closeModal(); commit("Dossier mis à jour.");
  },
  reply: openReply,
  copyreply(){
    const ta = $("#reply-text");
    navigator.clipboard?.writeText(ta.value).then(() => toast("Texte copié.")).catch(() => { ta.select(); toast("Sélectionnez le texte et copiez-le (Ctrl+C)."); });
  },
  sendreply(){
    const d = dossier(S.view.id), text = $("#reply-text").value.trim(), btn = document.querySelector('[data-act="sendreply"]');
    const w = guardCheck(text);
    if (w.length && !btn.dataset.confirmed) {
      $("#guard").innerHTML = `<div class="alert warn"><b>Ce message mentionne ${w.join(", ")}.</b><span>Vérifiez que c'est bien validé par l'entreprise, puis cliquez à nouveau pour confirmer.</span></div>`;
      btn.dataset.confirmed = "1"; return;
    }
    if (text.includes("[À compléter")) { $("#guard").innerHTML = `<div class="alert crit"><b>Le brouillon contient encore une zone à compléter.</b><span>Remplacez ou supprimez le passage entre crochets avant de valider.</span></div>`; return; }
    log(d.id, "out", "Réponse validée et enregistrée comme envoyée (simulé — aucun e-mail réel)", text);
    if (!d.firstResponseAt) d.firstResponseAt = S.now;
    const a = analyze(d);
    if (d.status === "nouvelle") d.status = a.missing.length ? "attente_infos" : "a_chiffrer";
    d.nextAction = a.missing.length ? "Attendre les informations du client" : "Établir le devis et l'associer au dossier";
    d.nextActionAt = S.now + D;
    if (d.id === S.demo.dossierId) S.demo.replied = true;
    closeModal(); commit("Réponse enregistrée. Aucun message réel n'a été envoyé.");
  },
  ack(){ const d = dossier(S.view.id); d.urgentAck = true; log(d.id, "sys", `Situation signalée prise en charge par ${me().name}`); commit("Prise en charge enregistrée."); },
  cat(el){ const d = dossier(S.view.id); d.need = el.dataset.cat; d.categoryConfirmed = true; log(d.id, "sys", `Catégorie confirmée : ${t("n_"+d.need)}`); commit("Catégorie confirmée."); },
  newquote(){ quoteForm(null, S.view.name === "dossier" ? S.view.id : null); },
  editquote(el){ quoteForm(S.quotes.find(q => q.id === el.dataset.id), null); },
  savequote(el){
    const v = formObj($("#qform")), id = el.dataset.id;
    const amount = v.amount === "" ? null : Number(v.amount);
    if (!v.ref.trim()) { toast("Indiquez la référence du devis.", true); return; }
    if (id) {
      const q = S.quotes.find(x => x.id === id);
      Object.assign(q, {ref:v.ref.trim(), amount, date:v.date?fromInput(v.date):null, due:v.due?fromInput(v.due):null});
      setQuoteStatus(q, v.status); log(q.dossierId, "quote", `Devis ${q.ref} modifié`);
      closeModal(); commit("Devis mis à jour."); flashKpis(["pending","accepted"]); return;
    }
    const dossierId = el.dataset.dossier || v.dossierId;
    if (S.quotes.some(q => q.ref === v.ref.trim())) { toast("Cette référence existe déjà.", true); return; }
    const q = {id:uid("q"), ref:v.ref.trim(), dossierId, amount, date:v.date?fromInput(v.date):null, due:v.due?fromInput(v.due):null, status:"a_preparer"};
    S.quotes.push(q);
    log(dossierId, "quote", `Devis ${q.ref} associé (${eurRaw(amount)} HT)`);
    setQuoteStatus(q, v.status);
    const d = dossier(dossierId);
    if (Q_OPEN.includes(q.status)) { d.nextAction = "Programmer les relances du devis"; d.nextActionAt = S.now; }
    if (dossierId === S.demo.dossierId) S.demo.quoteLinked = true;
    closeModal(); commit("Devis associé au dossier."); flashKpis(["pending"]);
  },
  schedule(el){ scheduleModal(S.quotes.find(q => q.id === el.dataset.id)); },
  doschedule(el){
    const q = S.quotes.find(x => x.id === el.dataset.id), r = createSequence(q, el.dataset.val === "1");
    if (r.error) { closeModal(); toast(r.error, true); return; }
    const d = dossier(q.dossierId);
    d.nextAction = el.dataset.val === "1" ? "Attendre la réponse du client" : "Valider les relances"; d.nextActionAt = r.seq.steps[0].due;
    if (q.dossierId === S.demo.dossierId) S.demo.scheduled = true;
    closeModal(); commit(el.dataset.val === "1" ? "Relances validées et programmées (envoi simulé)." : "Séquence créée : relances à valider."); flashKpis(["validate"]);
  },
  valstep(el){ const sq = S.sequences.find(s => s.id === el.dataset.seq), p = sq.steps.find(x => x.id === el.dataset.step); p.status = "programmee"; log(sq.dossierId, "follow", `Relance ${sq.steps.indexOf(p)+1} validée par ${me().name}`); commit("Relance validée et programmée."); flashKpis(["validate"]); },
  skipstep(el){ const sq = S.sequences.find(s => s.id === el.dataset.seq), p = sq.steps.find(x => x.id === el.dataset.step); p.status = "annulee"; log(sq.dossierId, "follow", `Relance ${sq.steps.indexOf(p)+1} retirée de la séquence`); commit("Relance retirée."); },
  suspend(el){ const sq = S.sequences.find(s => s.id === el.dataset.seq); sq.state = "suspendue"; sq.stopReason = `Suspendue par ${me().name}`; log(sq.dossierId, "follow", "Séquence de relances suspendue"); commit("Séquence suspendue."); },
  resume(el){ const sq = S.sequences.find(s => s.id === el.dataset.seq); sq.state = "active"; sq.stopReason = ""; sq.steps.forEach(p => { if (p.status !== "envoyee" && p.status !== "annulee" && p.due <= S.now) p.due = S.now + D; }); log(sq.dossierId, "follow", "Séquence de relances reprise"); commit("Séquence reprise."); },
  stopseq(el){ const sq = S.sequences.find(s => s.id === el.dataset.seq); stopSequences(s => s.id === sq.id, `Arrêtée manuellement par ${me().name}`); commit("Séquence arrêtée."); flashKpis(["validate"]); },
  clientreply(){
    const d = dossier(S.view.id);
    modal(`${t("sim_reply")} <span class="sim-tag">Simulé</span>`, `
      <p class="muted">Simule l'arrivée d'une réponse de ${esc(d.name)} (e-mail ou SMS). En production, elle serait rattachée automatiquement au dossier.</p>
      <div class="field"><label for="cr-text">Message du client</label><textarea id="cr-text" rows="5">Bonjour, merci pour le devis. J'ai une question sur le modèle proposé, pouvez-vous me rappeler ?</textarea></div>`,
      `<button class="btn" data-act="close">${t("cancel")}</button><button class="btn primary" data-act="doclientreply">Enregistrer la réponse</button>`);
  },
  doclientreply(){
    const d = dossier(S.view.id), text = $("#cr-text").value.trim() || "(message vide)";
    log(d.id, "in", "Réponse du client reçue (simulée)", text);
    const n = stopSequences(sq => sq.dossierId === d.id, "Le client a répondu");
    const q = quoteOf(d.id); if (q && q.status === "envoye") { q.status = "en_attente"; log(d.id, "quote", `Devis ${q.ref} : statut changé en En attente`); }
    d.nextAction = "Répondre au client"; d.nextActionAt = S.now;
    if (d.id === S.demo.dossierId && S.demo.scheduled) S.demo.clientReplied = true;
    closeModal(); commit(n ? `Réponse enregistrée. ${n} séquence(s) de relances arrêtée(s) automatiquement.` : "Réponse enregistrée."); flashKpis(["validate","pending"]);
  }
};

/* ---------- événements ---------- */
document.addEventListener("click", e => {
  const ov = e.target.closest("[data-overlay]"); if (ov && e.target === ov) { closeModal(); return; }
  const g = e.target.closest("[data-go]");
  if (g) {
    if (g.dataset.fstatus === "open") S.filter.qstatus = "open";
    else if (g.dataset.go === "quotes" && g.dataset.fstatus) S.filter.qstatus = g.dataset.fstatus;
    else if (g.dataset.go === "requests") S.filter.status = g.dataset.fstatus || "all";
    closeModal(); go(g.dataset.go); return;
  }
  const o = e.target.closest("[data-open]");
  if (o && o.dataset.open && o.dataset.open !== "null") {
    const id = o.dataset.open;
    if (id === S.demo.dossierId) S.demo.opened = true;
    closeModal(); go("dossier", id); return;
  }
  const fs = e.target.closest("[data-fstatus2]"); if (fs) { S.filter.status = fs.dataset.fstatus2; save(); render(); return; }
  const qf = e.target.closest("[data-qf]"); if (qf) { S.filter.qstatus = qf.dataset.qf; save(); render(); return; }
  const a = e.target.closest("[data-act]");
  if (a && !a.disabled && ACTIONS[a.dataset.act]) { e.preventDefault(); ACTIONS[a.dataset.act](a); }
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("#modal-root").innerHTML) closeModal(); });
let qTimer;
document.addEventListener("input", e => {
  if (e.target.id === "q") { clearTimeout(qTimer); qTimer = setTimeout(() => { S.filter.q = e.target.value; save(); const r = $("#rows"); if (r) r.innerHTML = rowsHtml(); }, 120); }
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.id === "fneed") { S.filter.need = el.value; save(); $("#rows").innerHTML = rowsHtml(); }
  else if (el.dataset.qstatus) { const q = S.quotes.find(x => x.id === el.dataset.qstatus); setQuoteStatus(q, el.value); commit(`Devis ${q.ref} : ${t("sq_"+el.value)}.`); }
  else if (el.hasAttribute("data-dstatus")) { const d = dossier(S.view.id); d.status = el.value; log(d.id, "status", `Statut du dossier changé en ${t("sd_"+el.value)}`); commit("Statut mis à jour."); }
  else if (el.dataset.role) { const m = member(el.dataset.role); if (m.role === "admin" && el.value !== "admin" && S.members.filter(x => x.role === "admin").length === 1) { toast("Il faut au moins un administrateur.", true); render(); return; } m.role = el.value; commit(`Rôle de ${m.name} : ${ROLES[m.role]}.`); }
  else if (el.hasAttribute("data-asuser")) { S.currentUser = el.value; commit(`Vous testez l'application en tant que ${me().name} (${ROLES[me().role]}).`); }
});
document.addEventListener("submit", e => {
  const f = e.target, k = f.dataset.form; if (!k) return;
  e.preventDefault();
  const v = formObj(f);
  if (k === "public") {
    if (!v.phone && !v.email) { toast("Indiquez un téléphone ou un e-mail pour être recontacté.", true); return; }
    const ref = nextRef("D-", S.dossiers);
    const d = {id:uid("d"), ref, createdAt:S.now, source:"Formulaire web", kind:v.kind, name:v.name.trim(), company:v.company||"", phone:v.phone||"", email:v.email||"", address:v.address||"", cp:v.cp, city:v.city||"",
      need:v.need||"", equipment:v.equipment||"", brand:v.brand||"", description:v.description.trim(), availability:v.availability||"", owner:"m2", status:"nouvelle",
      nextAction:"Première réponse au client", nextActionAt:S.now + 2*H, notes:[], firstResponseAt:null, categoryConfirmed:false, urgentAck:false};
    S.dossiers.push(d);
    S.events.push({id:uid("e"), dossierId:d.id, at:S.now, type:"create", text:"Demande reçue (formulaire web)", body:d.description, by:null});
    S.events.push({id:uid("e"), dossierId:d.id, at:S.now + 1000, type:"sys", text:"Analyse de l'assistant (simulée) : résumé et informations manquantes préparés", body:"", by:null});
    S.demo = {dossierId:d.id, formSubmitted:true, opened:false, replied:false, quoteLinked:false, scheduled:false, clientReplied:false};
    S.view = {name:"dashboard"}; save(); render(); window.scrollTo(0,0);
    toast(`Demande ${ref} reçue. Elle apparaît dans le tableau de bord.`); flashKpis(["nouv"]);
  } else if (k === "next") {
    const d = dossier(S.view.id); d.nextAction = v.text; d.nextActionAt = v.date ? fromInput(v.date) : null;
    if (v.owner !== d.owner) { d.owner = v.owner; log(d.id, "sys", `Dossier attribué à ${member(v.owner).name}`); }
    log(d.id, "sys", `Prochaine action : ${v.text || "aucune"}`); commit("Prochaine action enregistrée.");
  } else if (k === "note") {
    if (!v.text.trim()) return; const d = dossier(S.view.id); d.notes.push({at:S.now, by:S.currentUser, text:v.text.trim()}); commit("Note ajoutée.");
  } else if (k === "seqcfg") {
    const delays = [v.d0, v.d1, v.d2].map(Number);
    if (!(delays[0] < delays[1] && delays[1] < delays[2])) { toast("Les délais doivent être croissants (ex. 3, 7, 14).", true); return; }
    S.settings.seqDelays = delays; S.settings.seqTemplates = [v.t0, v.t1, v.t2]; S.settings.respectHours = !!v.respect;
    commit("Séquence par défaut enregistrée. Elle s'applique aux prochaines séquences.");
  } else if (k === "settings") {
    Object.assign(S.settings, {company:v.company, phone:v.phone, email:v.email, address:v.address, lang:v.lang, tz:v.tz, hours:v.hours, zone:v.zone, quoteValidity:Number(v.quoteValidity)||30});
    commit(v.lang === "en" ? "Settings saved." : "Paramètres enregistrés.");
  } else if (k === "templates") {
    Object.entries(v).forEach(([key, body]) => { if (S.templates[key]) S.templates[key].body = body; });
    commit("Modèles enregistrés.");
  }
});

/* ---------- démarrage ---------- */
load();
const HASH = {dashboard:"dashboard", demandes:"requests", devis:"quotes", relances:"followups", parametres:"settings", formulaire:"form"};
const h = (location.hash || "").slice(1);
if (HASH[h]) S.view = {name: HASH[h]};
render();
</script>
